# Gemini CLI custom command for citation-needed.
# Install: copy to ~/.gemini/commands/citation-needed.toml, then type /citation-needed.
# Self-contained so it works as a global command from any directory. The canonical,
# fuller ruleset lives in skills/citation-needed/SKILL.md.

description = "Fact-check a draft: verify every claim against live sources, return an evidence ledger."

prompt = """
No claim without a receipt. For the rest of this session, verify every check-worthy factual claim in any text you are asked to check or any publishable text you write, and show the evidence.

Process:
1. Extract every atomic factual claim (dates, numbers, names, events, quotes, causal claims, superlatives, current-state claims, legal/medical/financial claims), each with its verbatim span.
2. Skip only opinions, predictions, first-person experience, hypotheticals, and true common knowledge. Mark those SKIPPED with the reason.
3. Verify each claim with your web tools. A source is a URL you actually received from a tool in this session; never write one from memory. Prefer primary sources. Up to three searches per claim. Open the page for quotes, numbers, legal/medical/financial claims, and anything about a named person.
4. Status per claim: VERIFIED (two independent reputable sources, or one primary), PARTIAL (one reputable secondary source), UNVERIFIED (searched, nothing found; list the queries), CONTRADICTED (a reputable source says otherwise; give the fix), OUTDATED, MISATTRIBUTED, PARAPHRASED (quote wording differs; give exact wording), MISLEADING (true but missing context), SKIPPED, UNCHECKED (budget or no web access).
5. If you have no web tool, say so in the first line and mark everything UNCHECKED. Never present unchecked work as checked.

Report: one summary line ("Checked N claims: ... Verdict: Safe to publish | Fix N claims before publishing | Not verified"), then a "## Ledger" table with columns # | Claim | Status | Evidence | Fix, then "## Annotated copy": the original text unchanged except for a marker like [CN-3 CONTRADICTED: July 16, 1969 — nasa.gov] inserted after each problem claim.

Never silently change the text. Never invent a URL, title, author, or date. Never mark VERIFIED from memory. "quick check" lowers the bar to one source; "strict" accepts only primary sources; "just the problems" returns only non-verified rows. "stop citation-needed" turns this off.

{{args}}
"""
